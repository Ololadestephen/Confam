name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      # The salon decoy challenge needs no model key: it runs the original app, two correct fixes and six decoys.
      - name: No-key salon challenge
        run: >
          npm run confam -- challenge specimens/salon/cases/booking-integrity/case.json
          --project specimens/salon/project.json
          --workflow specimens/salon/cases/booking-integrity/workflow-v2-reviewed.json
          --manifest specimens/salon/cases/booking-integrity/challenges.json --fixture
      - run: npm run web:build -w confam

  # Uses this repository's reusable action the way another project would, on a correct and a faulty fix.
  review-action:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Review a correct fix
        uses: ./
        with:
          case: specimens/quote-tool/case-invalid.json
          project: specimens/quote-tool/project.json
          workflow: specimens/quote-tool/workflow-invalid.json
          candidate: specimens/quote-tool/patches/good.patch
          confirmation: fixture
          comment: true
      - name: Review a faulty fix
        id: faulty
        continue-on-error: true
        uses: ./
        with:
          case: specimens/quote-tool/case-invalid.json
          project: specimens/quote-tool/project.json
          workflow: specimens/quote-tool/workflow-invalid.json
          candidate: specimens/quote-tool/patches/faulty.patch
          confirmation: fixture
      - name: The faulty fix must be reported as a candidate failure
        env:
          CODE: ${{ steps.faulty.outputs.exit-code }}
        run: test "$CODE" = "1"
